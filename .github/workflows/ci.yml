name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Mana tests
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Run Mana test suite
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
        run: xcodebuild -project Mana.xcodeproj -scheme Mana -configuration Debug -destination 'platform=macOS,arch=arm64' test
