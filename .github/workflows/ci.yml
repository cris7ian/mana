name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Mana tests
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Cache macOS build artifacts
        uses: actions/cache@v6
        with:
          path: |
            build/mac
            !build/mac/Logs
          key: mac-derived-v1-${{ runner.os }}-${{ hashFiles('Mana.xcodeproj/project.pbxproj') }}
          restore-keys: mac-derived-v1-${{ runner.os }}-
      - name: Test verification tooling
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Verify static website
        run: python3 scripts/verify-website.py
      - name: Verify localization coverage and format arguments
        run: python3 scripts/verify-localizations.py
      - name: Run Mana test suite
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
        run: xcodebuild -project Mana.xcodeproj -scheme Mana -configuration Debug -destination 'platform=macOS,arch=arm64' -derivedDataPath build/mac test

  ios:
    name: Shared core and iPhone tests
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Cache ManaCore build artifacts
        uses: actions/cache@v6
        with:
          path: Packages/ManaCore/.build
          key: manacore-v1-${{ runner.os }}-${{ hashFiles('Packages/ManaCore/Package.swift') }}
          restore-keys: manacore-v1-${{ runner.os }}-
      - name: Cache iOS build artifacts
        uses: actions/cache@v6
        with:
          path: |
            build/ios
            !build/ios/Logs
          key: ios-derived-v1-${{ runner.os }}-${{ hashFiles('ios/ManaIOS.xcodeproj/project.pbxproj', 'scripts/verify-ios.sh') }}
          restore-keys: ios-derived-v1-${{ runner.os }}-
      - name: Test shared provider core
        run: swift test --package-path Packages/ManaCore
      - name: Test iPhone app and build widgets
        run: zsh scripts/verify-ios.sh
      - name: Verify compiler-extracted localization keys
        run: python3 scripts/verify-localizations.py --extracted build/ios/Build/Intermediates.noindex
